<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>Create an Account</h1>

            <p class="subtitle">
                Register to access the calculator application.
            </p>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="first-name">First Name</label>

                    <input
                        type="text"
                        id="first-name"
                        name="first_name"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="last-name">Last Name</label>

                    <input
                        type="text"
                        id="last-name"
                        name="last_name"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        minlength="3"
                        maxlength="50"
                        required
                    >

                    <small>Username must be at least 3 characters.</small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="6"
                        maxlength="128"
                        required
                    >

                    <small>
                        Use at least 6 characters with an uppercase letter,
                        lowercase letter, and number.
                    </small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        minlength="6"
                        maxlength="128"
                        required
                    >
                </div>

                <button type="submit" id="register-button">
                    Register
                </button>
            </form>

            <div
                id="message"
                class="message"
                role="alert"
                aria-live="polite"
            ></div>

            <p class="switch-page">
                Already have an account?
                <a href="/login">Log in</a>
            </p>
        </section>
    </main>

    <script src="/static/js/register.js"></script>
</body>
</html>
